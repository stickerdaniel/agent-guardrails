name: Post No Bills
description: Fail pull requests that carry AI co-author trailers, agent commit identities or hidden Unicode; require a model disclosure.
author: stickerdaniel

inputs:
  require-model-attribution:
    description: Require a "Generated with <model>" line as the last non-empty line of the PR body. true or false; false turns the check off.
    required: false
    default: "true"
  co-author-trailers:
    description: Severity of Co-authored-by trailers that name a coding agent, in commit messages and the PR body. error, warn or off.
    required: false
    default: error
  agent-identities:
    description: Severity of commits authored or committed by a coding agent's address. error, warn or off.
    required: false
    default: error
  hidden-unicode:
    description: Severity of invisible and private-use characters, and the mode the two settings below inherit. error, warn or off.
    required: false
    default: error
  unicode-homoglyphs:
    description: Severity of words that mix Latin with look-alike letters. inherit, error, warn or off.
    required: false
    default: inherit
  unicode-unusual-spaces:
    description: Severity of unusual spaces. inherit (warn unless hidden-unicode is off), error, warn or off.
    required: false
    default: inherit
  unicode-exclude-paths:
    description: Repository paths whose added lines the hidden Unicode check skips, one per line. A trailing / marks a directory.
    required: false
    default: ""
  allowed-identities:
    description: Addresses that are not coding agents, one email:<address> or github:<handle> per line.
    required: false
    default: ""
  additional-identities:
    description: Addresses that are coding agents besides the built-in ones, one email:<address> or github:<handle> per line.
    required: false
    default: ""
  additional-binary-extensions:
    description: Extensions that may be binary besides the built-in ones, lowercase without a dot, one per line.
    required: false
    default: ""
  additional-attribution-exemptions:
    description: PR author logins exempt from the attribution check, one per line.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run Post No Bills
      shell: bash
      # Composite actions get no INPUT_* variables, so every value the
      # entrypoint reads is named here. The inputs travel as one JSON map,
      # which also holds any name the caller wrote that matches no input, so
      # that the entrypoint can refuse it. This environment holds the token,
      # so no git runs in it: run.py checks the git version itself, after it
      # has masked the credential and in the environment it builds for git.
      env:
        CA_INPUTS: ${{ toJSON(inputs) }}
        CA_TOKEN: ${{ github.token }}
        CA_SERVER_URL: ${{ github.server_url }}
        CA_REPOSITORY: ${{ github.repository }}
        CA_EVENT_NAME: ${{ github.event_name }}
      run: |
        if ! command -v python3 >/dev/null 2>&1; then
          echo "::error title=post-no-bills::python3 is not on PATH. This action needs Python 3.10 or newer."
          exit 1
        fi
        python3 --version
        if ! python3 -I -c 'import sys; sys.exit(sys.version_info < (3, 10))'; then
          echo "::error title=post-no-bills::This action needs Python 3.10 or newer."
          exit 1
        fi
        python3 -I "$GITHUB_ACTION_PATH/run.py"
