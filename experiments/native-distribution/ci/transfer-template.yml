# TEMPLATE, not a workflow yet. EXPERIMENTAL Gate X transfer measurement for
# the unmerged spike pull request only.
#
# A workflow cannot name the commit that contains it, so the maintainer adds
# this file in a second commit, after the first is pushed:
#   1. Replace __SOURCE_SHA__ with the full SHA of the pushed commit that
#      added experiments/native-distribution.
#   2. Save it as .github/workflows/native-distribution-transfer.yml. Extend
#      the pin test explicitly for these two first-party, unreleased SHA
#      references; keep full-SHA validation and never invent a version.
#   3. It runs once, when the pull request is marked ready for review, not on
#      every push: 28 transfer jobs and two separate execution controls.
#
# Each round pairs two fresh jobs on the same runner label with identical
# steps except the one remote action each names, which the runner downloads
# during "Set up job":
#   candidate: the native spike action at __SOURCE_SHA__, downloaded only;
#   control:   the Python action at the frozen baseline 40382e2, downloaded only.
# Both remote steps are skipped, and both jobs run the identical local Rust
# launcher afterwards. Whether skipped actions are downloaded must be verified
# from every job's "Download action repository" log; absence is inconclusive,
# not zero download cost. The separate smoke job proves real remote execution.
# Sub-second download log timestamps measure preparation, not a complete
# Python-versus-Rust job speedup. Queue time stays outside the comparison.
# Do not add these component medians to unrelated checker medians to claim an
# end-to-end saving. The final native stage still needs its full-action gate.
name: Native distribution transfer

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  remote-execution:
    name: remote execution (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generate the typical capture
        run: python3 -I -B experiments/native-distribution/bench/gen_corpora.py --out "$RUNNER_TEMP/corpora" --case pr-typical
      - name: Run the remotely delivered candidate
        uses: stickerdaniel/agent-guardrails/experiments/native-distribution@__SOURCE_SHA__ # unmerged experiment
        with:
          capture: ${{ runner.temp }}/corpora/pr-typical.cap

  candidate:
    name: candidate (${{ matrix.arch }}, round ${{ matrix.round }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        round: [1, 2, 3, 4, 5, 6, 7]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Mark the first step
        run: echo "mark first-step $(date +%s%N)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generate the typical capture
        run: python3 -I -B experiments/native-distribution/bench/gen_corpora.py --out "$RUNNER_TEMP/corpora" --case pr-typical
      - name: Mark before the remote action
        run: echo "mark before-remote $(date +%s%N)"
      - name: Native spike action, downloaded but never run
        if: matrix.round == 0
        uses: stickerdaniel/agent-guardrails/experiments/native-distribution@__SOURCE_SHA__ # unmerged experiment
        with:
          capture: ${{ runner.temp }}/corpora/pr-typical.cap
      - name: Mark after the remote action
        run: echo "mark after-remote $(date +%s%N)"
      - name: The same launcher, run from the checkout
        env:
          AGX_CAPTURE: ${{ runner.temp }}/corpora/pr-typical.cap
        run: GITHUB_ACTION_PATH="$GITHUB_WORKSPACE/experiments/native-distribution" bash --noprofile --norc -- experiments/native-distribution/launch.sh
      - name: Mark after the direct run
        run: echo "mark after-direct $(date +%s%N)"

  control:
    name: control (${{ matrix.arch }}, round ${{ matrix.round }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        round: [1, 2, 3, 4, 5, 6, 7]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Mark the first step
        run: echo "mark first-step $(date +%s%N)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Generate the typical capture
        run: python3 -I -B experiments/native-distribution/bench/gen_corpora.py --out "$RUNNER_TEMP/corpora" --case pr-typical
      - name: Mark before the skipped remote action
        run: echo "mark before-remote $(date +%s%N)"
      - name: Python action at the frozen baseline, downloaded but never run
        # Rounds start at 1, so this never runs; the step exists to be downloaded.
        if: matrix.round == 0
        uses: stickerdaniel/agent-guardrails@40382e2107a899e428cad2ab6b1d3132c90d3dcf # unmerged experiment
      - name: Mark after the skipped remote action
        run: echo "mark after-remote $(date +%s%N)"
      - name: The same launcher, run from the checkout
        env:
          AGX_CAPTURE: ${{ runner.temp }}/corpora/pr-typical.cap
        run: GITHUB_ACTION_PATH="$GITHUB_WORKSPACE/experiments/native-distribution" bash --noprofile --norc -- experiments/native-distribution/launch.sh
      - name: Mark after the direct run
        run: echo "mark after-direct $(date +%s%N)"
