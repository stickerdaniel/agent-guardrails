name: Release

# A release is a lightweight vX.Y.Z tag on the tip of main. The tag filter is
# a glob, so .github/release.py checks the name again, exactly. A published
# release is immutable: its tag never moves and its version is never reused.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # Runs the tests with a read-only token, so no code under test ever runs
  # next to the token that can publish.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a lightweight vX.Y.Z tag on the tip of main
        run: python3 .github/release.py check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Run the tests
        run: python3 .github/release.py test
      - name: Require release notes in CHANGELOG.md
        run: python3 .github/release.py notes "$RUNNER_TEMP/notes.md"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Again, because main may have moved while the tests ran.
      - name: Require a lightweight vX.Y.Z tag on the tip of main
        run: python3 .github/release.py check
      - name: Take the release notes from CHANGELOG.md
        run: python3 .github/release.py notes "$RUNNER_TEMP/notes.md"
      - name: Publish the release and read it back
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release.py publish "$RUNNER_TEMP/notes.md"
