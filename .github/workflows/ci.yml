name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: git --version
      - run: python -m unittest discover -v

  # The one stable context branch protection requires. It runs even when a
  # matrix job fails or is cancelled, because a skipped job counts as passing.
  test:
    needs: unittest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix job to succeed
        env:
          RESULT: ${{ needs.unittest.result }}
        run: test "$RESULT" = success
